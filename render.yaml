services:
  - type: web
    name: doodledash-skribbl
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: on
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
