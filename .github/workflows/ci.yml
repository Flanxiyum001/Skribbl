name: Validate DoodleDash (Render)

on:
  push:
    branches: [main, feat/doodledash-multiplayer]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and simulated multiplayer tests
        run: npm run check
      - name: Real Node WebSocket multiplayer smoke test
        run: |
          npm start > /tmp/doodledash-node.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; cat /tmp/doodledash-node.log' EXIT
          npm run smoke
